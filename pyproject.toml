[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mingte-tech-service-tool"
version = "0.1.0"
description = "Сервисная утилита для картоприёмников и диспенсеров Mingte (MT163, MT166)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
mtservice = "mtservice.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
